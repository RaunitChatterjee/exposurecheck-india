# Local development stack: FastAPI + PostgreSQL (aggregate counters only)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exposurecheck
      POSTGRES_PASSWORD: exposurecheck
      POSTGRES_DB: exposurecheck
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://exposurecheck:exposurecheck@db:5432/exposurecheck
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
