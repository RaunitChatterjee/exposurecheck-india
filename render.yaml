# Render blueprint for the backend. Deploy the frontend separately on Vercel/Netlify.
services:
  - type: web
    name: exposurecheck-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HIBP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://exposurecheck.vercel.app
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: exposurecheck-db
          property: connectionString
databases:
  - name: exposurecheck-db
    plan: free
